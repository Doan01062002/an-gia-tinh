name: CI/CD Pipeline - An Gia Tịnh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    name: Build & Verify Production Static HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site with Astro
        run: npm run build

      - name: Verify Sitemap Generation
        run: |
          test -f dist/sitemap-index.xml && echo "✓ Sitemap generated successfully!"
          test -f dist/index.html && echo "✓ Home HTML generated successfully!"
          test -f dist/thuoc-lo-ban/index.html && echo "✓ Lỗ Ban Tool generated successfully!"
