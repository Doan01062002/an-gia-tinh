<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Sacred Crimson to Dark Mahogany -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800A0A" />
      <stop offset="40%" stop-color="#991414" />
      <stop offset="80%" stop-color="#660505" />
      <stop offset="100%" stop-color="#400202" />
    </linearGradient>

    <!-- Gold Gradients for Borders and Typography -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF0" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <linearGradient id="gold-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="450" fill="url(#bg-grad)" rx="24" />
  <rect width="900" height="450" fill="url(#glow)" rx="24" />

  <!-- Traditional Oriental Border Motif (Double Gold Line with Corner Knots) -->
  <rect x="18" y="18" width="864" height="414" rx="16" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.8" />
  <rect x="24" y="24" width="852" height="402" rx="12" fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Corner Ornamental Accents -->
  <g stroke="url(#gold-grad)" stroke-width="2" fill="none">
    <path d="M 32 46 L 46 32 L 60 46 L 46 60 Z" fill="#7A0000" />
    <circle cx="46" cy="46" r="3" fill="url(#gold-grad)" />
    <path d="M 868 46 L 854 32 L 840 46 L 854 60 Z" fill="#7A0000" />
    <circle cx="854" cy="46" r="3" fill="url(#gold-grad)" />
    <path d="M 32 404 L 46 390 L 60 404 L 46 418 Z" fill="#7A0000" />
    <circle cx="46" cy="404" r="3" fill="url(#gold-grad)" />
    <path d="M 868 404 L 854 390 L 840 404 L 854 418 Z" fill="#7A0000" />
    <circle cx="854" cy="404" r="3" fill="url(#gold-grad)" />
  </g>

  <!-- Festive Golden Confetti & Sparkles -->
  <g fill="url(#gold-light)" opacity="0.6">
    <polygon points="120,70 123,73 120,76 117,73" />
    <polygon points="180,110 185,115 180,120 175,115" />
    <polygon points="260,60 263,63 260,66 257,63" />
    <polygon points="720,80 724,84 720,88 716,84" />
    <polygon points="780,120 784,124 780,128 776,124" />
    <polygon points="820,65 823,68 820,71 817,68" />
    <polygon points="140,240 143,243 140,246 137,243" />
    <polygon points="760,260 763,263 760,266 757,263" />
    <circle cx="210" cy="85" r="2.5" />
    <circle cx="680" cy="95" r="2.5" />
    <circle cx="160" cy="180" r="2" />
    <circle cx="740" cy="190" r="2" />
  </g>

  <!-- Top Center Emblem: Sacred Lotus & Roofline -->
  <g transform="translate(450, 48) scale(0.65)" filter="url(#shadow)">
    <!-- Small Lotus Badge -->
    <path d="M 0 -25 C 10 -10, 18 5, 0 20 C -18 5, -10 -10, 0 -25 Z" fill="url(#gold-grad)" />
    <path d="M 0 20 C 14 18, 26 4, 22 -10 C 18 0, 10 12, 0 20 Z" fill="url(#gold-grad)" opacity="0.85" />
    <path d="M 0 20 C -14 18, -26 4, -22 -10 C -18 0, -10 12, 0 20 Z" fill="url(#gold-grad)" opacity="0.85" />
    <path d="M -35 25 C -15 20, 15 20, 35 25 C 25 30, -25 30, -35 25 Z" fill="url(#gold-grad)" />
  </g>

  <!-- Brand Subheader -->
  <text x="450" y="90" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="#FDE68A" filter="url(#shadow)">
    AN GIA TỊNH • XƯỞNG MỘC LÀNG NGHỀ SƠN ĐỒNG &amp; THẠCH THẤT
  </text>

  <!-- Cursive Header: Khai Xuân Rộn Ràng -->
  <text x="450" y="132" text-anchor="middle" font-family="'Be Vietnam Pro', Georgia, serif" font-style="italic" font-weight="600" font-size="28" fill="#FFFBEB" filter="url(#shadow)">
    Khai Xuân Rộn Ràng — An Gia Đón Lộc
  </text>

  <!-- Main Headline: ƯU ĐÃI NGẬP TRÀN -->
  <text x="450" y="196" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-weight="900" font-size="48" letter-spacing="1.5" fill="url(#gold-light)" filter="url(#shadow)">
    ƯU ĐÃI NGẬP TRÀN
  </text>

  <!-- Subheadline: ĐỒ THỜ HIỆN ĐẠI CHUẨN THƯỚC LỖ BAN 38.8CM -->
  <text x="450" y="235" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="4" fill="#FEF08A" filter="url(#shadow)">
    100% GỖ LÕI TỰ NHIÊN • CHUẨN LỖ BAN 38.8CM • DUYỆT CLIP MỘC 15S
  </text>

  <!-- 3 Big Promotional Cards / Badges (Tâm Phát Reference) -->
  <g transform="translate(0, 260)">
    <!-- Badge 1: QUÀ TẶNG TRỊ GIÁ 500K -->
    <g transform="translate(90, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="110" rx="14" fill="url(#badge-bg)" stroke="url(#gold-grad)" stroke-width="2.5" />
      <rect x="5" y="5" width="200" height="100" rx="10" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
      <text x="105" y="38" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#7F1D1D">
        QUÀ TẶNG TRỊ GIÁ
      </text>
      <text x="105" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="32" fill="#B91C1C">
        500K
      </text>
      <text x="105" y="98" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10" fill="#92400E">
        BỘ VĂN KHẤN &amp; ÁM KHÓI
      </text>
    </g>

    <!-- Badge 2: GIẢM GIÁ 30% (Hero Center Badge) -->
    <g transform="translate(345, -10)" filter="url(#shadow)">
      <!-- Outer Glowing Halo -->
      <circle cx="105" cy="65" r="68" fill="url(#gold-circle)" stroke="#FFFBEB" stroke-width="3" />
      <circle cx="105" cy="65" r="62" fill="url(#badge-bg)" stroke="#B45309" stroke-width="2" />
      <text x="105" y="48" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="14" letter-spacing="1" fill="#7F1D1D">
        GIẢM GIÁ
      </text>
      <text x="105" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="40" fill="#B91C1C">
        30%
      </text>
      <text x="105" y="106" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="10" fill="#92400E">
        TOÀN BỘ MẪU MỚI
      </text>
    </g>

    <!-- Badge 3: MIỄN PHÍ GIAO HÀNG & CLIP MỘC -->
    <g transform="translate(600, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="110" rx="14" fill="url(#badge-bg)" stroke="url(#gold-grad)" stroke-width="2.5" />
      <rect x="5" y="5" width="200" height="100" rx="10" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
      <text x="105" y="38" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#7F1D1D">
        XEM CLIP MỘC 15S
      </text>
      <text x="105" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="32" fill="#B91C1C">
        MIỄN PHÍ
      </text>
      <text x="105" y="98" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10" fill="#92400E">
        GIAO HÀNG &amp; LẮP ĐẶT TẬN NƠI
      </text>
    </g>
  </g>

  <!-- Bottom Hotline Strip -->
  <g transform="translate(450, 422)">
    <text text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#FEF08A">
      📍 XƯỞNG SƠN ĐỒNG (HOÀI ĐỨC) &amp; CANH NẬU (THẠCH THẤT) • 📞 HOTLINE: 0339.533.380
    </text>
  </g>
</svg>